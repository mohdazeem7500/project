<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohd Azeem – Dynamic Project Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #080c14;
    --surface: #111827;
    --surface2: #1e293b;
    --border: rgba(56,189,248,0.15);
    --accent: #38bdf8;
    --green: #34d399;
    --red: #f87171;
    --purple: #a78bfa;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 2rem 5%; }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
  .logo { font-family: 'Syne', sans-serif; font-size: 1.5rem; color: var(--accent); }
  .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; transition: 0.2s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: #080c14; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .form-group { margin-bottom: 1.2rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); }
  input, select, textarea { width: 100%; padding: 0.75rem 1rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-family: inherit; font-size: 0.95rem; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .projects-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .projects-table th, .projects-table td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
  .projects-table th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
  .badge { padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
  .modal.hidden { display: none; }
  .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem; }
</style>
</head>
<body>

<div class="container">
  <!-- AUTH BOX (shown if not logged in) -->
  <div id="authBox" class="card" style="max-width:400px;margin:5rem auto;text-align:center;">
    <h2 style="margin-bottom:1rem;color:var(--accent);">Admin Login</h2>
    <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem;">Enter your admin password to manage and upload dynamic projects.</p>
    <div class="form-group">
      <input type="password" id="adminPass" placeholder="Admin Password" onkeypress="if(event.key==='Enter')login()">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="login()"><i class="fa-solid fa-lock"></i> Unlock Dashboard</button>
  </div>

  <!-- MAIN DASHBOARD (shown after login) -->
  <div id="dashboard" style="display:none;">
    <div class="header">
      <div>
        <div class="logo">Mohd Azeem <span>• Project Admin</span></div>
        <div style="color:var(--text-muted);font-size:0.85rem;margin-top:0.3rem;">Dynamic Project Upload & Manager (Vercel Serverless)</div>
      </div>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
        <a href="/" target="_blank" class="btn btn-secondary"><i class="fa-solid fa-eye"></i> View Live Site</a>
        <button class="btn btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Upload New Project</button>
        <button class="btn btn-secondary" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 style="font-size:1.2rem;">All Uploaded Projects (<span id="projCount">0</span>)</h3>
        <button class="btn btn-secondary" onclick="loadProjects()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="projects-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Icon</th>
              <th>Project Title</th>
              <th>Category</th>
              <th>Tools</th>
              <th>Links</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="projectsList">
            <tr><td colspan="7" style="text-align:center;">Loading projects...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- PROJECT UPLOAD / EDIT MODAL -->
<div id="projectModal" class="modal hidden">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
      <h3 id="modalTitle">Upload New Project</h3>
      <button onclick="closeModal()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">&times;</button>
    </div>
    <form id="projectForm" onsubmit="saveProject(event)">
      <input type="hidden" id="editId">
      <div class="grid-2">
        <div class="form-group">
          <label>Emoji / Icon</label>
          <input type="text" id="emoji" placeholder="🛒, 📊, ⚡, 📈, 🤖" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="Excel">Excel</option>
            <option value="Power BI">Power BI</option>
            <option value="SQL">SQL</option>
            <option value="Python">Python</option>
            <option value="Tableau">Tableau</option>
            <option value="Data Analytics">Data Analytics</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Project Title</label>
        <input type="text" id="title" placeholder="e.g. Healthcare Patient Analytics Dashboard" required>
      </div>
      <div class="form-group">
        <label>Project Description</label>
        <textarea id="description" rows="4" placeholder="Describe the business problem, key metrics analyzed, and analytical impact..." required></textarea>
      </div>
      <div class="form-group">
        <label>Tools & Skills (Comma separated)</label>
        <input type="text" id="tools" placeholder="Excel, Power BI, SQL, DAX, Python" required>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>GitHub Repository URL</label>
          <input type="url" id="githubUrl" placeholder="https://github.com/mohdazeem7500/...">
        </div>
        <div class="form-group">
          <label>Live Demo / Dashboard URL (Optional)</label>
          <input type="url" id="demoUrl" placeholder="https://app.powerbi.com/...">
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:1rem;margin-top:1.5rem;">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save & Publish</button>
      </div>
    </form>
  </div>
</div>

<script>
let token = localStorage.getItem('azeem_admin_token') || '';
let projectsCache = [];

function checkAuth() {
  if (token) {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadProjects();
  } else {
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
  }
}
checkAuth();

async function login() {
  const password = document.getElementById('adminPass').value;
  if (!password) return alert('Enter admin password');
  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      token = data.token;
      localStorage.setItem('azeem_admin_token', token);
      checkAuth();
    } else {
      alert(data.error || 'Invalid credentials');
    }
  } catch (err) {
    alert('Server error: ' + err.message);
  }
}

function logout() {
  localStorage.removeItem('azeem_admin_token');
  token = '';
  checkAuth();
}

async function loadProjects() {
  try {
    const res = await fetch('/api/projects');
    const data = await res.json();
    if (data.success) {
      projectsCache = data.projects;
      document.getElementById('projCount').innerText = projectsCache.length;
      renderProjectsTable();
    }
  } catch (err) {
    document.getElementById('projectsList').innerHTML = `<tr><td colspan="7" style="color:var(--red);text-align:center;">Failed to load: ${err.message}</td></tr>`;
  }
}

function renderProjectsTable() {
  const tbody = document.getElementById('projectsList');
  if (projectsCache.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No projects uploaded yet. Click "Upload New Project"!</td></tr>`;
    return;
  }
  tbody.innerHTML = projectsCache.map(p => `
    <tr>
      <td style="font-family:'JetBrains Mono';">${p.number || '•'}</td>
      <td style="font-size:1.5rem;">${p.emoji || '📊'}</td>
      <td><strong>${p.title}</strong></td>
      <td><span class="badge" style="background:rgba(56,189,248,0.15);color:var(--accent);">${p.category || 'General'}</span></td>
      <td style="font-size:0.85rem;color:var(--text-muted);">${(p.tools || []).join(', ')}</td>
      <td>
        ${p.githubUrl ? `<a href="${p.githubUrl}" target="_blank" style="color:var(--accent);margin-right:0.5rem;"><i class="fa-brands fa-github"></i></a>` : ''}
        ${p.demoUrl ? `<a href="${p.demoUrl}" target="_blank" style="color:var(--green);"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
      </td>
      <td>
        <button class="btn btn-secondary" style="padding:0.3rem 0.6rem;font-size:0.8rem;" onclick="editProject('${p.id}')"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-danger" style="padding:0.3rem 0.6rem;font-size:0.8rem;margin-left:0.3rem;" onclick="deleteProject('${p.id}')"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>
  `).join('');
}

function openModal(isEdit = false) {
  document.getElementById('projectModal').classList.remove('hidden');
  if (!isEdit) {
    document.getElementById('modalTitle').innerText = 'Upload New Project';
    document.getElementById('projectForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('emoji').value = '📊';
  }
}

function closeModal() {
  document.getElementById('projectModal').classList.add('hidden');
}

function editProject(id) {
  const p = projectsCache.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalTitle').innerText = 'Edit Project: ' + p.title;
  document.getElementById('editId').value = p.id;
  document.getElementById('emoji').value = p.emoji || '📊';
  document.getElementById('category').value = p.category || 'Excel';
  document.getElementById('title').value = p.title;
  document.getElementById('description').value = p.description;
  document.getElementById('tools').value = (p.tools || []).join(', ');
  document.getElementById('githubUrl').value = p.githubUrl || '';
  document.getElementById('demoUrl').value = p.demoUrl || '';
  openModal(true);
}

async function saveProject(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const payload = {
    id: id || undefined,
    emoji: document.getElementById('emoji').value,
    category: document.getElementById('category').value,
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    tools: document.getElementById('tools').value.split(',').map(s => s.trim()).filter(Boolean),
    githubUrl: document.getElementById('githubUrl').value,
    demoUrl: document.getElementById('demoUrl').value
  };

  const method = id ? 'PUT' : 'POST';
  try {
    const res = await fetch('/api/projects', {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok && data.success) {
      closeModal();
      loadProjects();
    } else {
      alert(data.error || 'Failed to save project');
    }
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}

async function deleteProject(id) {
  if (!confirm('Are you sure you want to delete this project?')) return;
  try {
    const res = await fetch('/api/projects', {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ id })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      loadProjects();
    } else {
      alert(data.error || 'Failed to delete');
    }
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}
</script>
</body>
</html>
